name: 名鉄公式時刻表データ更新

on:
  workflow_dispatch:

  schedule:
    # 毎日 日本時間 午前3時ごろ
    - cron: "0 18 * * *"

# GitHub Actionsからリポジトリへ
# データを書き戻すための権限
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. リポジトリを取得
      # ==========================================
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true


      # ==========================================
      # 2. Pythonをセットアップ
      # ==========================================
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # 3. 必要なライブラリをインストール
      # ==========================================
      - name: 必要なライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf pdfplumber lxml


      # ==========================================
      # 4. データフォルダを準備
      # ==========================================
      - name: データフォルダを準備
        run: |
          mkdir -p data
          mkdir -p data/pdfs


      # ==========================================
      # 5. 名鉄公式時刻表ページを取得
      # ==========================================
      - name: 名鉄公式時刻表ページを取得
        run: |
          python - <<'PY'
          import requests

          url = "https://www.meitetsu.co.jp/train/timetable/"

          response = requests.get(
              url,
              timeout=60,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          response.raise_for_status()

          with open(
              "data/meitetsu_timetable.html",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(response.text)

          print("名鉄公式時刻表ページ取得成功")
          print("文字数:", len(response.text))
          PY


      # ==========================================
      # 6. 公式PDF一覧を取得
      # ==========================================
      - name: 公式時刻表PDF一覧を作成
        run: |
          python - <<'PY'
          import json
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          page_url = "https://www.meitetsu.co.jp/train/timetable/"

          with open(
              "data/meitetsu_timetable.html",
              "r",
              encoding="utf-8"
          ) as f:
              html = f.read()

          soup = BeautifulSoup(
              html,
              "lxml"
          )

          pdfs = []

          for a in soup.find_all(
              "a",
              href=True
          ):

              href = a["href"]

              if ".pdf" not in href.lower():
                  continue

              url = urljoin(
                  page_url,
                  href
              )

              if "meitetsu.co.jp" not in url:
                  continue

              label = a.get_text(
                  " ",
                  strip=True
              )

              pdfs.append({
                  "url": url,
                  "label": label
              })


          # 重複削除
          unique = {}

          for item in pdfs:
              unique[item["url"]] = item

          pdfs = list(
              unique.values()
          )


          with open(
              "data/pdf_list.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  pdfs,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "取得したPDF数:",
              len(pdfs)
          )

          for item in pdfs:

              print(
                  item["label"]
              )

              print(
                  item["url"]
              )
          PY


      # ==========================================
      # 7. 公式PDFをダウンロード
      # ==========================================
      - name: 公式時刻表PDFをダウンロード
        run: |
          python - <<'PY'
          import json
          import requests
          import hashlib
          import os

          with open(
              "data/pdf_list.json",
              "r",
              encoding="utf-8"
          ) as f:

              pdfs = json.load(f)


          os.makedirs(
              "data/pdfs",
              exist_ok=True
          )


          success = 0
          failed = 0


          for index, item in enumerate(
              pdfs,
              start=1
          ):

              url = item["url"]

              filename = (
                  hashlib.sha256(
                      url.encode("utf-8")
                  ).hexdigest()[:24]
                  + ".pdf"
              )

              path = os.path.join(
                  "data/pdfs",
                  filename
              )


              print()
              print(
                  f"[{index}/{len(pdfs)}]"
              )
              print(url)


              try:

                  response = requests.get(
                      url,
                      timeout=120,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  response.raise_for_status()


                  with open(
                      path,
                      "wb"
                  ) as f:

                      f.write(
                          response.content
                      )


                  success += 1

                  print(
                      "取得成功:",
                      len(response.content),
                      "bytes"
                  )


              except Exception as e:

                  failed += 1

                  print(
                      "取得失敗:",
                      e
                  )


          print()
          print(
              "=============================="
          )
          print(
              "PDF取得結果"
          )
          print(
              "成功:",
              success
          )
          print(
              "失敗:",
              failed
          )
          print(
              "=============================="
          )
          PY


      # ==========================================
      # 8. PDFの表を解析
      # ==========================================
      - name: PDFの表データを解析
        run: |
          python - <<'PY'
          import os
          import json
          import glob
          import pdfplumber

          output = []

          pdf_files = glob.glob(
              "data/pdfs/*.pdf"
          )


          print(
              "解析対象PDF:",
              len(pdf_files)
          )


          for pdf_path in pdf_files:

              filename = os.path.basename(
                  pdf_path
              )

              print()
              print(
                  "解析:",
                  filename
              )


              try:

                  with pdfplumber.open(
                      pdf_path
                  ) as pdf:

                      pages = []


                      for page_number, page in enumerate(
                          pdf.pages,
                          start=1
                      ):

                          tables = page.extract_tables()

                          page_tables = []


                          for table in tables:

                              if not table:
                                  continue


                              cleaned = []


                              for row in table:

                                  if not row:
                                      continue


                                  cleaned_row = []


                                  for cell in row:

                                      if cell is None:
                                          cell = ""


                                      cell = (
                                          str(cell)
                                          .replace(
                                              "\n",
                                              " "
                                          )
                                          .replace(
                                              "\u3000",
                                              " "
                                          )
                                          .strip()
                                      )


                                      cleaned_row.append(
                                          cell
                                      )


                                  cleaned.append(
                                      cleaned_row
                                  )


                              if cleaned:

                                  page_tables.append(
                                      cleaned
                                  )


                          text = (
                              page.extract_text()
                              or ""
                          )


                          pages.append({
                              "page": page_number,
                              "tables": page_tables,
                              "text": text
                          })


                  output.append({
                      "file": filename,
                      "pages": pages
                  })


              except Exception as e:

                  print(
                      "解析失敗:",
                      e
                  )


          with open(
              "data/timetable_tables.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print(
              "PDF表データの解析が完了しました"
          )
          PY


      # ==========================================
      # 9. 列車データを構築
      # ==========================================
      - name: 列車データを構築
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime, timezone, timedelta


          INPUT = "data/timetable_tables.json"
          OUTPUT = "data/timetables.json"


          with open(
              INPUT,
              "r",
              encoding="utf-8"
          ) as f:

              pdfs = json.load(f)


          trains = {}


          # 列車番号
          train_pattern = re.compile(
              r"^[0-9]{2,5}[A-Za-z]?$"
          )


          # 時刻
          time_pattern = re.compile(
              r"^[0-2]?[0-9]:[0-5][0-9]$"
          )


          def normalize(value):

              if value is None:
                  return ""

              return (
                  str(value)
                  .replace(
                      "\u3000",
                      " "
                  )
                  .replace(
                      "\n",
                      " "
                  )
                  .strip()
              )


          def is_train_number(value):

              value = normalize(
                  value
              )

              if not value:
                  return False

              if not train_pattern.match(
                  value
              ):
                  return False


              if value.isdigit():

                  try:

                      if int(value) < 100:
                          return False

                  except Exception:
                      return False


              return True


          def is_time(value):

              value = normalize(
                  value
              )

              return bool(
                  time_pattern.match(
                      value
                  )
              )


          for pdf in pdfs:

              pdf_name = pdf.get(
                  "file",
                  ""
              )


              for page in pdf.get(
                  "pages",
                  []
              ):

                  for table in page.get(
                      "tables",
                      []
                  ):

                      if not table:
                          continue


                      max_columns = max(
                          len(row)
                          for row in table
                      )


                      for column in range(
                          max_columns
                      ):

                          values = []


                          for row in table:

                              if column < len(row):

                                  values.append(
                                      normalize(
                                          row[column]
                                      )
                                  )

                              else:

                                  values.append(
                                      ""
                                  )


                          for train_index, value in enumerate(
                              values
                          ):

                              if not is_train_number(
                                  value
                              ):
                                  continue


                              train_number = value


                              # PDF単位で重複を分離
                              key = (
                                  train_number
                                  + "__"
                                  + pdf_name
                              )


                              if key not in trains:

                                  trains[key] = {
                                      "trainNumber":
                                          train_number,

                                      "type":
                                          "",

                                      "destination":
                                          "",

                                      "origin":
                                          "",

                                      "route":
                                          "",

                                      "sourcePdf":
                                          pdf_name,

                                      "stations":
                                          []
                                  }


                              train = trains[key]


                              for row_index, row in enumerate(
                                  table
                              ):

                                  if train_index >= len(row):
                                      continue


                                  time_value = normalize(
                                      row[train_index]
                                  )


                                  if not is_time(
                                      time_value
                                  ):
                                      continue


                                  station = ""


                                  # 時刻の左側から駅名を探す
                                  for left in range(
                                      train_index - 1,
                                      -1,
                                      -1
                                  ):

                                      if left >= len(row):
                                          continue


                                      candidate = normalize(
                                          row[left]
                                      )


                                      if not candidate:
                                          continue


                                      if is_time(
                                          candidate
                                      ):
                                          continue


                                      if is_train_number(
                                          candidate
                                      ):
                                          continue


                                      station = candidate

                                      break


                                  if not station:
                                      continue


                                  train["stations"].append({
                                      "station":
                                          station,

                                      "time":
                                          time_value
                                  })


          # ==========================================
          # 重複駅時刻を整理
          # ==========================================

          for train in trains.values():

              unique = []

              seen = set()


              for stop in train["stations"]:

                  key = (
                      stop.get(
                          "station",
                          ""
                      ),
                      stop.get(
                          "time",
                          ""
                      )
                  )


                  if key in seen:
                      continue


                  seen.add(
                      key
                  )

                  unique.append(
                      stop
                  )


              train["stations"] = unique


              # 最初と最後の駅
              if unique:

                  train["origin"] = (
                      unique[0]["station"]
                  )

                  train["destination"] = (
                      unique[-1]["station"]
                  )


          # ==========================================
          # JST時刻
          # ==========================================

          jst = timezone(
              timedelta(
                  hours=9
              )
          )


          result = {

              "revision":
                  "2026-03-14",

              "generatedAt":
                  datetime.now(
                      jst
                  ).isoformat(),

              "source":
                  "名古屋鉄道公式時刻表",

              "trainCount":
                  len(trains),

              "trains":
                  list(
                      trains.values()
                  )
          }


          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print(
              "=============================="
          )
          print(
              "列車データ生成完了"
          )
          print(
              "列車データ数:",
              len(trains)
          )
          print(
              "=============================="
          )
          PY


      # ==========================================
      # 10. データが本当に生成されたか確認
      # ==========================================
      - name: 生成データを確認
        run: |
          python - <<'PY'
          import json
          import os

          path = "data/timetables.json"


          if not os.path.exists(
              path
          ):

              print(
                  "ERROR: timetables.json がありません"
              )

              raise SystemExit(1)


          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          trains = data.get(
              "trains",
              []
          )


          print()
          print(
              "=============================="
          )
          print(
              "最終確認"
          )
          print(
              "列車データ数:",
              len(trains)
          )
          print(
              "=============================="
          )


          if len(trains) == 0:

              print(
                  "ERROR: 列車データが0件です"
              )

              raise SystemExit(1)


          for train in trains[:5]:

              print(
                  "列車番号:",
                  train.get(
                      "trainNumber",
                      ""
                  )
              )

              print(
                  "始発:",
                  train.get(
                      "origin",
                      ""
                  )
              )

              print(
                  "終着:",
                  train.get(
                      "destination",
                      ""
                  )
              )

              print(
                  "駅数:",
                  len(
                      train.get(
                          "stations",
                          []
                      )
                  )
              )

              print(
                  "---"
              )


          print(
              "データ確認OK"
          )
          PY


      # ==========================================
      # 11. GitHubへ保存
      # ==========================================
      - name: GitHubへ保存
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "=============================="
          echo "GitHubへの保存を開始"
          echo "=============================="


          # Git設定
          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # 現在のブランチを確認
          BRANCH="${GITHUB_REF_NAME}"

          echo "現在のブランチ:"
          echo "$BRANCH"


          # データをステージ
          git add data/


          # 変更がない場合
          if git diff --cached --quiet; then

            echo "変更されたデータはありません"

            exit 0

          fi


          echo "変更内容:"
          git diff --cached --stat


          # コミット
          git commit \
            -m "名鉄公式時刻表データを更新"


          # GitHubへプッシュ
          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${BRANCH}"


          echo "=============================="
          echo "GitHubへの保存が完了しました"
          echo "=============================="
