name: 名鉄公式時刻表データ更新

on:
  workflow_dispatch:

  schedule:
    # 毎日 日本時間 03:00
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  update-timetable:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. GitHubリポジトリを取得
      # =========================================================
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # =========================================================
      # 2. Pythonを準備
      # =========================================================
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # 3. 必要なライブラリをインストール
      # =========================================================
      - name: 必要なライブラリをインストール
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            beautifulsoup4 \
            pypdf \
            pdfplumber \
            lxml

      # =========================================================
      # 4. 作業用ディレクトリを準備
      # =========================================================
      - name: 作業ディレクトリを準備
        run: |
          rm -rf work
          mkdir -p work
          mkdir -p data

      # =========================================================
      # 5. 名鉄公式時刻表ページを取得
      # =========================================================
      - name: 名鉄公式時刻表ページを取得
        run: |
          python - <<'PY'
          import requests

          url = "https://www.meitetsu.co.jp/train/timetable/"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              )
          }

          print("公式時刻表ページを取得します")
          print(url)

          response = requests.get(
              url,
              headers=headers,
              timeout=30
          )

          response.raise_for_status()

          with open(
              "work/timetable.html",
              "wb"
          ) as f:
              f.write(response.content)

          print(
              "取得完了:",
              len(response.content),
              "bytes"
          )
          PY

      # =========================================================
      # 6. 公式PDFのURLを抽出
      # =========================================================
      - name: 公式PDF一覧を取得
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          html_path = "work/timetable.html"

          with open(
              html_path,
              "rb"
          ) as f:
              html = f.read()

          soup = BeautifulSoup(
              html,
              "lxml"
          )

          base_url = "https://www.meitetsu.co.jp/train/timetable/"

          pdf_urls = []

          for a in soup.find_all("a"):
              href = a.get("href")

              if not href:
                  continue

              absolute_url = urljoin(
                  base_url,
                  href
              )

              if ".pdf" in absolute_url.lower():
                  pdf_urls.append(
                      absolute_url
                  )

          # 重複除去
          pdf_urls = list(
              dict.fromkeys(pdf_urls)
          )

          print(
              "PDF件数:",
              len(pdf_urls)
          )

          if len(pdf_urls) == 0:
              raise RuntimeError(
                  "公式PDFが見つかりませんでした"
              )

          with open(
              "work/pdf_urls.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for url in pdf_urls:
                  f.write(url + "\n")

                  print(
                      "PDF:",
                      url
                  )
          PY

      # =========================================================
      # 7. PDFを一時的にダウンロード
      #
      # ※ GitHubにはPDFを保存しません
      # =========================================================
      - name: 公式PDFを取得
        run: |
          python - <<'PY'
          import requests
          import os
          import hashlib

          os.makedirs(
              "work/pdfs",
              exist_ok=True
          )

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              )
          }

          with open(
              "work/pdf_urls.txt",
              "r",
              encoding="utf-8"
          ) as f:
              urls = [
                  line.strip()
                  for line in f
                  if line.strip()
              ]

          success = 0
          failed = 0

          for index, url in enumerate(
              urls,
              start=1
          ):

              print(
                  f"[{index}/{len(urls)}] PDF取得:",
                  url
              )

              try:
                  response = requests.get(
                      url,
                      headers=headers,
                      timeout=60
                  )

                  response.raise_for_status()

                  content = response.content

                  if not content.startswith(
                      b"%PDF"
                  ):
                      print(
                          "PDFではないためスキップ"
                      )
                      failed += 1
                      continue

                  filename = (
                      hashlib.sha256(
                          url.encode(
                              "utf-8"
                          )
                      ).hexdigest()[:24]
                      + ".pdf"
                  )

                  path = os.path.join(
                      "work/pdfs",
                      filename
                  )

                  with open(
                      path,
                      "wb"
                  ) as f:
                      f.write(content)

                  success += 1

              except Exception as e:
                  print(
                      "取得失敗:",
                      repr(e)
                  )
                  failed += 1

          print()
          print(
              "PDF取得成功:",
              success
          )

          print(
              "PDF取得失敗:",
              failed
          )

          if success == 0:
              raise RuntimeError(
                  "PDFを1件も取得できませんでした"
              )
          PY

      # =========================================================
      # 8. PDFを解析してJSONを生成
      # =========================================================
      - name: 時刻表を解析
        run: |
          python - <<'PY'
          import pdfplumber
          import json
          import os
          import re
          from datetime import datetime, timezone

          PDF_DIR = "work/pdfs"
          OUTPUT = "data/timetables.json"

          trains = []

          # -----------------------------------------------------
          # 列車種別判定
          # -----------------------------------------------------
          TYPES = [
              "ミュースカイ",
              "快速特急",
              "特急",
              "快速急行",
              "急行",
              "準急",
              "普通",
          ]

          def detect_type(text):
              if not text:
                  return "普通"

              for train_type in TYPES:
                  if train_type in text:
                      return train_type

              # PDFによっては略称表記があるため補助判定
              if "μSKY" in text:
                  return "ミュースカイ"

              if "ミュースカイ" in text:
                  return "ミュースカイ"

              if "快速特急" in text:
                  return "快速特急"

              if "快速急行" in text:
                  return "快速急行"

              if "特急" in text:
                  return "特急"

              if "急行" in text:
                  return "急行"

              if "準急" in text:
                  return "準急"

              return "普通"

          # -----------------------------------------------------
          # 時刻判定
          # -----------------------------------------------------
          TIME_RE = re.compile(
              r"(?<!\d)([01]?\d|2[0-3]):([0-5]\d)(?!\d)"
          )

          def extract_times(text):
              if not text:
                  return []

              return TIME_RE.findall(
                  text
              )

          # -----------------------------------------------------
          # 列車番号候補
          # -----------------------------------------------------
          TRAIN_NO_RE = re.compile(
              r"(?<!\d)(\d{1,5})(?!\d)"
          )

          def find_train_numbers(text):
              if not text:
                  return []

              result = []

              for match in TRAIN_NO_RE.findall(
                  text
              ):
                  number = match

                  # 年号などを除外
                  if number in {
                      "2024",
                      "2025",
                      "2026",
                      "2027",
                  }:
                      continue

                  result.append(
                      number
                  )

              return list(
                  dict.fromkeys(result)
              )

          # -----------------------------------------------------
          # 行から駅名候補を取得
          # -----------------------------------------------------
          def clean_station_name(text):
              if not text:
                  return ""

              text = text.strip()

              # 時刻などを削除
              text = TIME_RE.sub(
                  "",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()

          # -----------------------------------------------------
          # PDF解析
          # -----------------------------------------------------
          pdf_files = sorted(
              [
                  os.path.join(
                      PDF_DIR,
                      filename
                  )
                  for filename in os.listdir(
                      PDF_DIR
                  )
                  if filename.lower().endswith(
                      ".pdf"
                  )
              ]
          )

          print(
              "解析対象PDF:",
              len(pdf_files)
          )

          for pdf_index, pdf_path in enumerate(
              pdf_files,
              start=1
          ):

              print()
              print(
                  f"[{pdf_index}/{len(pdf_files)}]",
                  os.path.basename(pdf_path)
              )

              try:
                  with pdfplumber.open(
                      pdf_path
                  ) as pdf:

                      for page_number, page in enumerate(
                          pdf.pages,
                          start=1
                      ):

                          try:
                              text = page.extract_text() or ""
                          except Exception as e:
                              print(
                                  "テキスト抽出失敗:",
                                  repr(e)
                              )
                              continue

                          if not text.strip():
                              continue

                          train_numbers = (
                              find_train_numbers(
                                  text
                              )
                          )

                          if not train_numbers:
                              continue

                          train_type = detect_type(
                              text
                          )

                          times = (
                              extract_times(
                                  text
                              )
                          )

                          # ページ全体を1列車として扱わないため、
                          # 検出した列車番号ごとに基本情報を生成
                          for train_number in train_numbers:

                              # 同じPDF内の同じ列車番号の重複を防止
                              key = (
                                  f"{train_number}_"
                                  f"{os.path.basename(pdf_path)}_"
                                  f"{page_number}"
                              )

                              stations = []

                              for line in text.splitlines():

                                  line = line.strip()

                                  if not line:
                                      continue

                                  if TIME_RE.search(
                                      line
                                  ):
                                      station = clean_station_name(
                                          line
                                      )

                                      if station:
                                          stations.append(
                                              station
                                          )

                              # 重複駅名を除去
                              stations = list(
                                  dict.fromkeys(
                                      stations
                                  )
                              )

                              trains.append({
                                  "id": key,
                                  "trainNumber": train_number,
                                  "type": train_type,
                                  "destination": "",
                                  "origin": "",
                                  "route": "",
                                  "pdf": os.path.basename(
                                      pdf_path
                                  ),
                                  "page": page_number,
                                  "times": [
                                      f"{h}:{m}"
                                      for h, m in times
                                  ],
                                  "stations": stations,
                              })

              except Exception as e:
                  print(
                      "PDF解析失敗:",
                      repr(e)
                  )

          # -----------------------------------------------------
          # データ整理
          # -----------------------------------------------------
          unique = {}

          for train in trains:

              key = train["id"]

              if key not in unique:
                  unique[key] = train

          trains = list(
              unique.values()
          )

          # -----------------------------------------------------
          # JSON
          # -----------------------------------------------------
          data = {
              "version": 1,
              "updatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),

              "source": (
                  "名古屋鉄道公式時刻表"
              ),

              "sourceUrl": (
                  "https://www.meitetsu.co.jp/"
                  "train/timetable/"
              ),

              "trainCount": len(
                  trains
              ),

              "trains": trains,
          }

          os.makedirs(
              "data",
              exist_ok=True
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(
              "================================"
          )

          print(
              "列車データ:",
              len(trains),
              "件"
          )

          print(
              "保存先:",
              OUTPUT
          )

         
