name: 名鉄公式時刻表データ更新

on:
  workflow_dispatch:

  schedule:
    # 毎日 日本時間 午前3時ごろに実行
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # リポジトリを取得
      - name: リポジトリを取得
        uses: actions/checkout@v4

      # Pythonをセットアップ
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 必要なライブラリをインストール
      - name: 必要なライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf pdfplumber

      # データ保存フォルダを作成
      - name: データフォルダを作成
        run: |
          mkdir -p data
          mkdir -p data/pdfs

      # 名鉄公式時刻表ページを取得
      - name: 名鉄公式時刻表ページを取得
        run: |
          python - <<'PY'
          import requests

          url = "https://www.meitetsu.co.jp/train/timetable/"

          r = requests.get(
              url,
              timeout=60,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          r.raise_for_status()

          with open("data/timetable_page.html", "w", encoding="utf-8") as f:
              f.write(r.text)

          print("名鉄公式時刻表ページ取得成功")
          print("文字数:", len(r.text))
          PY

      # 公式ページからPDF一覧を取得
      - name: 公式時刻表PDF一覧を取得
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          import json

          page_url = "https://www.meitetsu.co.jp/train/timetable/"

          with open("data/timetable_page.html", "r", encoding="utf-8") as f:
              html = f.read()

          soup = BeautifulSoup(html, "html.parser")

          pdfs = []

          for a in soup.find_all("a", href=True):
              href = a["href"]

              if ".pdf" not in href.lower():
                  continue

              url = urljoin(page_url, href)

              if "meitetsu.co.jp" not in url:
                  continue

              text = a.get_text(" ", strip=True)

              pdfs.append({
                  "url": url,
                  "text": text
              })

          # 重複削除
          unique = {}
          for item in pdfs:
              unique[item["url"]] = item

          pdfs = list(unique.values())

          with open(
              "data/pdf_list.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  pdfs,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("取得したPDF数:", len(pdfs))

          for item in pdfs:
              print(item["url"])
          PY

      # 公式PDFをダウンロード
      - name: 公式時刻表PDFをダウンロード
        run: |
          python - <<'PY'
          import requests
          import json
          import os
          import hashlib

          with open(
              "data/pdf_list.json",
              "r",
              encoding="utf-8"
          ) as f:
              pdfs = json.load(f)

          os.makedirs("data/pdfs", exist_ok=True)

          for index, item in enumerate(pdfs, start=1):

              url = item["url"]

              filename = hashlib.md5(
                  url.encode("utf-8")
              ).hexdigest() + ".pdf"

              path = os.path.join(
                  "data/pdfs",
                  filename
              )

              print()
              print("PDF:", index, "/", len(pdfs))
              print(url)

              try:
                  r = requests.get(
                      url,
                      timeout=120,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  r.raise_for_status()

                  with open(path, "wb") as f:
                      f.write(r.content)

                  print(
                      "保存:",
                      filename,
                      "サイズ:",
                      len(r.content)
                  )

              except Exception as e:
                  print(
                      "取得失敗:",
                      url,
                      e
                  )

          PY

      # PDFを解析
      - name: 時刻表PDFを解析
        run: |
          python - <<'PY'
          import os
          import json
          import re
          import glob
          from pypdf import PdfReader

          pdf_files = glob.glob("data/pdfs/*.pdf")

          print("解析対象PDF:", len(pdf_files))

          result = {
              "revision": "2026-03-14",
              "generated_at": "",
              "source": "名古屋鉄道公式時刻表",
              "trains": {},
              "pdfs": []
          }

          for pdf_path in pdf_files:

              print()
              print("解析:", pdf_path)

              try:
                  reader = PdfReader(pdf_path)

                  pages = []

                  for page_number, page in enumerate(reader.pages):

                      try:
                          text = page.extract_text() or ""
                      except Exception:
                          text = ""

                      pages.append({
                          "page": page_number + 1,
                          "text": text
                      })

                  result["pdfs"].append({
                      "file": os.path.basename(pdf_path),
                      "pages": pages
                  })

              except Exception as e:

                  print(
                      "PDF解析失敗:",
                      pdf_path,
                      e
                  )

          # PDF解析結果を保存
          with open(
              "data/timetable_raw.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("PDF解析結果を保存しました")
          PY

      # 列車番号を抽出
      - name: 列車番号データを生成
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime, timezone, timedelta

          input_file = "data/timetable_raw.json"
          output_file = "data/timetables.json"

          with open(
              input_file,
              "r",
              encoding="utf-8"
          ) as f:
              raw = json.load(f)

          trains = {}

          # 名鉄の列車番号として使われる可能性が高い形式
          pattern = re.compile(
              r"(?<![0-9])([0-9]{2,5}[A-Z]?)(?![0-9])"
          )

          for pdf in raw.get("pdfs", []):

              pdf_name = pdf.get("file", "")

              for page in pdf.get("pages", []):

                  text = page.get("text", "")

                  numbers = pattern.findall(text)

                  for number in numbers:

                      # 明らかなページ番号などを除外
                      if number.isdigit():

                          n = int(number)

                          if n < 100:
                              continue

                      if number not in trains:

                          trains[number] = {
                              "trainNumber": number,
                              "route": "",
                              "type": "",
                              "destination": "",
                              "origin": "",
                              "stations": [],
                              "sourcePdf": pdf_name
                          }

          jst = timezone(
              timedelta(hours=9)
          )

          result = {
              "revision": "2026-03-14",
              "generatedAt": datetime.now(jst).isoformat(),
              "source": "名古屋鉄道公式時刻表",
              "trains": trains
          }

          with open(
              output_file,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "抽出した列車番号:",
              len(trains)
          )

          print(
              "保存:",
              output_file
          )
          PY

      # Gitの変更を確認
      - name: 更新内容を確認
        run: |
          echo "===== git status ====="
          git status --short

          echo "===== data ====="
          ls -lh data/

          echo "===== timetables.json ====="

          if [ -f data/timetables.json ]; then
            wc -c data/timetables.json
          else
            echo "timetables.json がありません"
          fi

      # データをGitHubへ保存
      - name: データをGitHubへ保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "変更はありません"
          else
            git commit -m "名鉄公式時刻表データを更新"
            git push
          fi
