name: Update Meitetsu Timetable and Deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 6'
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "style.css"
      - "tools/**"
      - "data/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: meitetsu-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install pdfplumber

      - name: Download official PDFs and build timetable
        run: |
          python tools/build_all_official.py

      - name: Validate timetable data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/timetables.json")

          if not p.exists():
              raise SystemExit(
                  "data/timetables.json が生成されていません"
              )

          data = json.loads(
              p.read_text(encoding="utf-8")
          )

          trains = data.get("trains", [])

          print("列車数:", len(trains))

          if len(trains) < 1000:
              raise SystemExit(
                  f"解析された列車数が少なすぎます: {len(trains)}"
              )

          for train in trains:

              if not train.get("trainNumber"):
                  raise SystemExit(
                      "列車番号が空のデータがあります"
                  )

              if not isinstance(
                  train.get("stops"), list
              ):
                  raise SystemExit(
                      f"停車駅データが不正です: "
                      f"{train.get('trainNumber')}"
                  )

              if not train["stops"]:
                  raise SystemExit(
                      f"停車駅がありません: "
                      f"{train.get('trainNumber')}"
                  )

          print("時刻表データの検証 OK")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
