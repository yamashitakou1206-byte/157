name: Update Meitetsu Timetable

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pdfplumber lxml

      - name: Download and parse official timetable
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/build_timetable.py

      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/timetables.json
          git diff --cached --quiet && echo "No timetable changes." && exit 0
          git commit -m "名鉄公式時刻表データを更新"
          git pull --rebase origin main
          git push origin HEAD:main
