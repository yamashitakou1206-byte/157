name: Update Meitetsu Timetable

on:
  workflow_dispatch:

  schedule:
    # 毎週月曜日 03:00 JST
    # GitHub Actions の cron は UTC
    - cron: "0 18 * * 0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # GitHubリポジトリを取得
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # Pythonをセットアップ
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------
      # 必要なライブラリをインストール
      # -----------------------------
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber

      # -----------------------------
      # PDFから時刻表JSONを生成
      # -----------------------------
      - name: Build timetable JSON
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/build_timetable.py

      # -----------------------------
      # 生成されたJSONを確認
      # -----------------------------
      - name: Check generated JSON
        run: |
          python - <<'PY'
          import json
          import os

          path = "data/timetables.json"

          if not os.path.exists(path):
              raise SystemExit(
                  "ERROR: data/timetables.json が生成されていません"
              )

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          trains = data.get("trains", [])

          print("JSON version:", data.get("version"))
          print("Train count:", len(trains))
          print("Parser:", data.get("parser"))
          print("Day types:", data.get("dayTypeCounts"))

          if len(trains) < 10:
              raise SystemExit(
                  f"ERROR: 列車データが少なすぎます: {len(trains)}"
              )

          print("JSON check: OK")
          PY

      # -----------------------------
      # JSONをGitHubへ保存
      # -----------------------------
      - name: Commit timetable JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/timetables.json

          if git diff --cached --quiet; then
            echo "No timetable changes."
            exit 0
          fi

          git commit -m "名鉄公式時刻表データを更新"

          git pull --rebase origin main

          git push origin HEAD:main
