name: Update Meitetsu Timetable and Deploy Pages

on:
  workflow_dispatch:

  schedule:
    # 毎週日曜日 03:00 JST
    - cron: "0 18 * * 6"

  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "style.css"
      - "icon-180.png"
      - "icon.svg"
      - "tools/**"
      - "data/**"
      - ".github/workflows/update-timetable.yml"

# GitHub Pagesへのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# Pagesのデプロイが複数同時に走るのを防止
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ==========================================================
  # 1. 名鉄公式PDFから時刻表JSONを生成
  # ==========================================================
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install pdfplumber

      - name: Download official PDFs and build timetable
        run: |
          python tools/build_all_official.py

      # -------------------------------------------------------
      # timetables.json が正常に生成されたか確認
      # -------------------------------------------------------
      - name: Validate timetable data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/timetables.json")

          if not p.exists():
              raise SystemExit(
                  "ERROR: data/timetables.json が生成されていません"
              )

          data = json.loads(
              p.read_text(encoding="utf-8")
          )

          trains = data.get("trains", [])

          print("=" * 50)
          print("名鉄時刻表データ検証")
          print("=" * 50)
          print("列車数:", len(trains))

          if len(trains) < 1000:
              raise SystemExit(
                  f"ERROR: 解析された列車数が少なすぎます: {len(trains)}"
              )

          invalid_number = []
          invalid_stops = []

          for train in trains:

              number = train.get("trainNumber")

              if not number:
                  invalid_number.append(train)
                  continue

              stops = train.get("stops")

              if not isinstance(stops, list):
                  invalid_stops.append(number)
                  continue

              if len(stops) == 0:
                  invalid_stops.append(number)

          if invalid_number:
              raise SystemExit(
                  f"ERROR: 列車番号なし: {len(invalid_number)}件"
              )

          if invalid_stops:
              raise SystemExit(
                  "ERROR: 停車駅なし: "
                  + ", ".join(invalid_stops[:20])
              )

          print("時刻表データ検証 OK")
          print("=" * 50)
          PY

      # -------------------------------------------------------
      # Pagesへ渡すデータをartifact化
      # -------------------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."


  # ==========================================================
  # 2. GitHub Pagesへ公開
  # ==========================================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
