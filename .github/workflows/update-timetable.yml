name: Update Meitetsu Timetable and Deploy Pages

on:
  workflow_dispatch:

  schedule:
    # 毎週日曜日 03:00 JST
    - cron: "0 18 * * 6"

  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "style.css"
      - "icon-180.png"
      - "icon.svg"
      - "tools/**"
      - "data/**"
      - ".github/workflows/update-timetable.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ==========================================================
  # 1. 公式PDFからv12時刻表を生成
  # ==========================================================
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # リポジトリ取得
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 実際にActionsが取得したコミットとtoolsを確認
      # --------------------------------------------------------
      - name: Show checked-out revision and tools
        run: |
          echo "COMMIT=$(git rev-parse HEAD)"
          echo "TOOLS:"
          find tools -maxdepth 1 -type f -printf '%f\n' | sort

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------------
      # PDF解析ライブラリ
      # --------------------------------------------------------
      - name: Install PDF parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install pdfplumber

      # --------------------------------------------------------
      # 古いJSONを削除
      #
      # 旧version 10のtimetables.jsonを誤って
      # Pagesへ公開することを防ぐ
      # --------------------------------------------------------
      - name: Remove old generated timetable
        run: |
          rm -f data/timetables.json
          test ! -f data/timetables.json

      # --------------------------------------------------------
      # 60個の公式PDF取得
      # +
      # build_timetable_fixed_v12.py 実行
      # --------------------------------------------------------
      - name: Download official PDFs and build timetable
        run: |
          python tools/build_all_official.py

      # ========================================================
      # 全路線・全列車検証
      # ========================================================
      - name: Validate complete v12 timetable
        run: |
          python - <<'PY'
          import json
          import re

          from collections import Counter
          from collections import defaultdict
          from pathlib import Path


          # ====================================================
          # JSON読み込み
          # ====================================================

          p = Path("data/timetables.json")

          if not p.is_file():
              raise SystemExit(
                  "ERROR: data/timetables.json が生成されていません"
              )


          data = json.loads(
              p.read_text(
                  encoding="utf-8"
              )
          )


          version = data.get("version")
          build = data.get("build")
          trains = data.get("trains")
          train_count = data.get("trainCount")


          print("=" * 72)
          print("Meitetsu timetable validation")
          print("=" * 72)

          print(
              "version    :",
              version
          )

          print(
              "build      :",
              build
          )

          print(
              "trainCount :",
              train_count
          )


          # ====================================================
          # version 12以外は禁止
          # ====================================================

          if version != 12:

              raise SystemExit(
                  f"ERROR: v12ではありません: "
                  f"version={version!r}"
              )


          # ====================================================
          # build識別子
          # ====================================================

          if (
              not isinstance(build, str)
              or not build.startswith("12-")
          ):

              raise SystemExit(
                  f"ERROR: v12 build識別子が不正です: "
                  f"build={build!r}"
              )


          # ====================================================
          # trains確認
          # ====================================================

          if not isinstance(trains, list):

              raise SystemExit(
                  "ERROR: trains が配列ではありません"
              )


          if train_count != len(trains):

              raise SystemExit(
                  "ERROR: trainCount不一致: "
                  f"metadata={train_count}, "
                  f"actual={len(trains)}"
              )


          # 明らかに少なすぎる場合は失敗
          if len(trains) < 1000:

              raise SystemExit(
                  "ERROR: 解析列車数が少なすぎます: "
                  f"{len(trains)}"
              )


          # ====================================================
          # 名鉄の有効種別
          # ====================================================

          valid_types = {
              "普通",
              "準急",
              "急行",
              "快速急行",
              "特急",
              "快速特急",
              "ミュースカイ",
          }


          valid_days = {
              "weekday",
              "holiday",
          }


          type_counts = Counter()
          day_counts = Counter()

          invalid = []
          suspicious = []

          duplicate_keys = defaultdict(list)


          # ====================================================
          # 時刻形式
          # ====================================================

          time_re = re.compile(
              r"^(?:[01]?\d|2[0-4]):[0-5]\d$"
          )


          # ====================================================
          # 明らかに壊れている駅名を検出
          #
          # 旧parserで発生していた
          #
          # 空港空港空港
          # レレ...
          # ||...
          # 列車番号...
          # 行先...
          #
          # 等を検出
          # ====================================================

          bad_station_re = re.compile(
              r"(?:"
              r"\|\|"
              r"|\.{2,}"
              r"|レレ"
              r"|列車番号"
              r"|行先"
              r"|[=]{2,}"
              r"|\d{3,}"
              r"|始.{8,}"
              r"|終\d"
              r")"
          )


          # ====================================================
          # HH:MM → 分
          # ====================================================

          def minute_value(s):

              h, m = map(
                  int,
                  s.split(":")
              )

              return (
                  h * 60
                  + m
              )


          # ====================================================
          # 全列車チェック
          # ====================================================

          for i, train in enumerate(trains):


              # ------------------------------------------------
              # 基本情報
              # ------------------------------------------------

              number = str(
                  train.get(
                      "trainNumber"
                  )
                  or ""
              ).strip()


              train_type = str(
                  train.get(
                      "type"
                  )
                  or ""
              ).strip()


              day_type = str(
                  train.get(
                      "dayType"
                  )
                  or ""
              ).strip()


              stops = train.get(
                  "stops"
              )


              origin = str(
                  train.get(
                      "origin"
                  )
                  or ""
              ).strip()


              destination = str(
                  train.get(
                      "destination"
                  )
                  or ""
              ).strip()


              # ------------------------------------------------
              # 列車番号
              # ------------------------------------------------

              if not number:

                  invalid.append(
                      (
                          i,
                          "trainNumberなし"
                      )
                  )

                  continue


              # ------------------------------------------------
              # 種別
              # ------------------------------------------------

              if train_type not in valid_types:

                  invalid.append(
                      (
                          number,
                          "不正種別="
                          + repr(
                              train_type
                          )
                      )
                  )


              # ------------------------------------------------
              # 平日 / 土休日
              # ------------------------------------------------

              if day_type not in valid_days:

                  invalid.append(
                      (
                          number,
                          "不正dayType="
                          + repr(
                              day_type
                          )
                      )
                  )


              # ------------------------------------------------
              # stops
              # ------------------------------------------------

              if (
                  not isinstance(
                      stops,
                      list
                  )
                  or len(stops) < 2
              ):

                  invalid.append(
                      (
                          number,
                          "stopsが2駅未満"
                      )
                  )

                  continue


              type_counts[
                  train_type
              ] += 1


              day_counts[
                  day_type
              ] += 1


              # ------------------------------------------------
              # 始発・終端
              # ------------------------------------------------

              first_station = str(
                  stops[0].get(
                      "station"
                  )
                  or ""
              ).strip()


              last_station = str(
                  stops[-1].get(
                      "station"
                  )
                  or ""
              ).strip()


              # originとの一致
              if (
                  origin
                  and first_station
                  and origin
                  != first_station
              ):

                  suspicious.append(
                      (
                          number,
                          "origin不一致 "
                          + repr(origin)
                          + "!="
                          + repr(
                              first_station
                          )
                      )
                  )


              # destinationは
              # PDF区間境界の可能性があるので
              # ここでは警告のみ
              if (
                  destination
                  and last_station
                  and destination
                  != last_station
              ):

                  suspicious.append(
                      (
                          number,
                          "destination/末尾駅 "
                          + repr(destination)
                          + "/"
                          + repr(
                              last_station
                          )
                      )
                  )


              # =================================================
              # 駅・時刻チェック
              # =================================================

              previous = None


              for stop in stops:


                  station = str(
                      stop.get(
                          "station"
                      )
                      or ""
                  ).strip()


                  time_value = (
                      stop.get(
                          "time"
                      )
                      or stop.get(
                          "departure"
                      )
                      or stop.get(
                          "arrival"
                      )
                  )


                  # ---------------------------------------------
                  # 駅名なし
                  # ---------------------------------------------

                  if not station:

                      invalid.append(
                          (
                              number,
                              "空の駅名"
                          )
                      )

                      continue


                  # ---------------------------------------------
                  # 駅名解析崩れ
                  # ---------------------------------------------

                  if bad_station_re.search(
                      station
                  ):

                      invalid.append(
                          (
                              number,
                              "駅名解析崩れ="
                              + repr(
                                  station
                              )
                          )
                      )


                  # ---------------------------------------------
                  # 時刻
                  # ---------------------------------------------

                  if time_value:


                      time_value = str(
                          time_value
                      ).strip()


                      # HH:MM以外
                      if not time_re.fullmatch(
                          time_value
                      ):

                          invalid.append(
                              (
                                  number,
                                  "不正時刻="
                                  + repr(
                                      time_value
                                  )
                              )
                          )

                          continue


                      current = minute_value(
                          time_value
                      )


                      # -----------------------------------------
                      # 時刻逆行検出
                      # -----------------------------------------

                      if (
                          previous is not None
                          and current < previous
                      ):


                          # 20時以降
                          # ↓
                          # 03時以前
                          #
                          # の場合だけ日跨ぎとして許可
                          if (
                              previous
                              >= 20 * 60
                              and current
                              <= 3 * 60
                          ):

                              current += (
                                  24 * 60
                              )


                          else:

                              invalid.append(
                                  (
                                      number,
                                      "時刻逆行="
                                      + str(
                                          previous
                                      )
                                      + "->"
                                      + time_value
                                      + " station="
                                      + repr(
                                          station
                                      )
                                  )
                              )


                      previous = current


              # =================================================
              # 完全重複列車チェック
              # =================================================

              first_time = str(
                  stops[0].get(
                      "time"
                  )
                  or stops[0].get(
                      "departure"
                  )
                  or stops[0].get(
                      "arrival"
                  )
                  or ""
              )


              last_time = str(
                  stops[-1].get(
                      "time"
                  )
                  or stops[-1].get(
                      "departure"
                  )
                  or stops[-1].get(
                      "arrival"
                  )
                  or ""
              )


              duplicate_key = (
                  day_type,
                  number,
                  first_station,
                  last_station,
                  first_time,
                  last_time,
              )


              duplicate_keys[
                  duplicate_key
              ].append(
                  i
              )


          # ====================================================
          # 全7種別確認
          # ====================================================

          required_types = valid_types


          missing_types = sorted(
              required_types
              - set(
                  type_counts
              )
          )


          print(
              "Types      :",
              dict(
                  sorted(
                      type_counts.items()
                  )
              )
          )


          print(
              "Day types  :",
              dict(
                  sorted(
                      day_counts.items()
                  )
              )
          )


          print(
              "Invalid    :",
              len(
                  invalid
              )
          )


          print(
              "Warnings   :",
              len(
                  suspicious
              )
          )


          # ----------------------------------------------------
          # 種別不足
          # ----------------------------------------------------

          if missing_types:

              raise SystemExit(
                  "ERROR: 必要な種別が出力されていません: "
                  + ", ".join(
                      missing_types
                  )
              )


          # ----------------------------------------------------
          # 平日・休日
          # ----------------------------------------------------

          if (
              not day_counts.get(
                  "weekday"
              )
              or not day_counts.get(
                  "holiday"
              )
          ):

              raise SystemExit(
                  "ERROR: 平日または土休日データがありません"
              )


          # ====================================================
          # 完全重複
          # ====================================================

          exact_duplicates = [
              (
                  key,
                  indexes
              )

              for (
                  key,
                  indexes
              )
              in duplicate_keys.items()

              if len(
                  indexes
              ) > 1
          ]


          if exact_duplicates:

              print(
                  "Exact duplicate examples:"
              )


              for (
                  key,
                  indexes
              ) in exact_duplicates[:20]:

                  print(
                      " ",
                      key,
                      "indexes=",
                      indexes
                  )


              raise SystemExit(
                  "ERROR: 完全重複列車が残っています: "
                  + str(
                      len(
                          exact_duplicates
                      )
                  )
                  + "組"
              )


          # ====================================================
          # 異常データ
          # ====================================================

          if invalid:

              print(
                  "Invalid examples:"
              )


              for item in invalid[:100]:

                  print(
                      " ",
                      item
                  )


              raise SystemExit(
                  "ERROR: 全列車検証で"
                  "異常データを検出しました: "
                  + str(
                      len(
                          invalid
                      )
                  )
                  + "件"
              )


          # ====================================================
          # 警告
          # ====================================================

          if suspicious:

              print(
                  "Warning examples "
                  "(deployは継続):"
              )


              for item in suspicious[:50]:

                  print(
                      " ",
                      item
                  )


          # ====================================================
          # 成功
          # ====================================================

          print(
              "=" * 72
          )

          print(
              "SUCCESS: "
              "v12 全列車検証 OK"
          )

          print(
              "=" * 72
          )

          PY


      # ========================================================
      # 実際にPagesへ送るJSONを最終確認
      # ========================================================
      - name: Show generated timetable checksum
        run: |
          sha256sum data/timetables.json

          python - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(
              Path(
                  "data/timetables.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          print(
              "DEPLOY VERSION:",
              d.get("version")
          )

          print(
              "DEPLOY BUILD:",
              d.get("build")
          )

          print(
              "DEPLOY TRAINS:",
              len(
                  d.get(
                      "trains",
                      []
                  )
              )
          )

          PY


      # ========================================================
      # Pages用artifact
      # ========================================================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."


  # ==========================================================
  # 2. GitHub Pagesへ公開
  # ==========================================================
  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
