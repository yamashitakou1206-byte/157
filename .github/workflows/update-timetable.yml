name: Update Meitetsu Timetable and Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "style.css"
      - "index.html"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        continue-on-error: true

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Build timetable data
        run: |
          if [ -f scripts/update_timetable.py ]; then
            python3 scripts/update_timetable.py || true
          elif [ -f scripts/update_timetable.js ]; then
            node scripts/update_timetable.js || true
          fi

      - name: Verify application files
        run: |
          test -f index.html
          test -f app.js
          test -f style.css

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Commit generated timetable data
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data || true
          git diff --cached --quiet || git commit -m "Update timetable data"
          git push || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
