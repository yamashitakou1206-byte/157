<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>名鉄 運転台表示シミュレーター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="back-btn" id="backBtn">‹ 列車一覧</button>
      <div class="title-wrap">
        <div class="title">神宮前乗務区</div>
        <div class="sub" id="dateText">--:--　----</div>
      </div>
      <div class="tools">
        <button id="themeBtn" title="表示切替">☼</button>
        <button id="zoomOut">−</button>
        <button id="zoomIn">＋</button>
        <button id="simOpen">⋮</button>
      </div>
    </header>

    <main class="screen">
      <section class="left">
        <div class="train-head">
          <div class="type" id="typeBox">準急</div>
          <div class="small-cell" id="carsBox">6<span>両</span></div>
          <div class="small-cell" id="mBox">M</div>
          <div class="small-cell notice">通告</div>
        </div>

        <div class="route-head">
          <div class="route-cell"><span>発</span><strong id="fromStation">—</strong></div>
          <div class="route-cell"><span>着</span><strong id="toStation">—</strong></div>
          <div class="train-no"><strong id="trainNo">—</strong><span>列車</span></div>
        </div>

        <div class="table-head">
          <div></div><div>駅</div><div>到着</div><div>発車</div>
        </div>
        <div id="timetable" class="timetable"></div>
      </section>

      <section class="right">
        <div class="status" id="statusText">運転中</div>
        <div class="clock-area">
          <canvas id="clock" width="280" height="280"></canvas>
          <div class="digital" id="digital">--:--:--</div>
        </div>
        <div class="article-title">記事</div>
        <div class="article" id="article">自動放送なし<br>平日・各務原線・知多新線・神宮前乗務区</div>
      </section>
    </main>

    <!-- 停車30秒前に表示 -->
    <div id="stopAlert" class="stop-alert hidden" aria-live="assertive">
      <div class="alert-inner">
        <div class="alert-cars"><span id="alertCars">0</span><small>両</small></div>
        <div class="alert-station" id="alertStation">常滑停車</div>
        <div class="alert-times">
          <div><span>着時刻</span><b id="alertArrival">--:--:--</b></div>
          <div><span>発時刻</span><b id="alertDeparture">--:--:--</b></div>
        </div>
        <button id="stopConfirmButton">停車確認</button>
      </div>
    </div>

    <!-- テスト用シミュレーター -->
    <aside id="simPanel" class="sim-panel hidden">
      <div class="sim-title">
        <b>時刻シミュレーター</b>
        <button id="simClose">×</button>
      </div>
      <div class="mode-row">
        <button id="realMode">実時間</button>
        <button id="simMode" class="selected">テスト</button>
      </div>
      <label>テスト時刻
        <input id="simTime" type="time" step="1" value="16:06:00">
      </label>
      <div class="speed-row">
        <span>速度</span>
        <button data-speed="1">1×</button>
        <button data-speed="10">10×</button>
        <button data-speed="30">30×</button>
        <button data-speed="60">60×</button>
      </div>
      <div class="sim-buttons">
        <button id="minus30">−30秒</button>
        <button id="plus30">＋30秒</button>
        <button id="plus60">＋1分</button>
      </div>
      <div class="sim-buttons">
        <button id="simPlay">▶ 再生</button>
        <button id="simPause">⏸ 停止</button>
      </div>
      <button id="eventTest" class="event-test">停車イベントをテスト</button>
      <div class="sim-readout">現在: <b id="simReadout">16:06:00</b></div>
      <div class="sim-note">実時間では端末の時計を使用。テストでは上の時刻を仮想時計として使用します。PDF解析JSONの停車駅データをそのまま判定します。</div>
    </aside>

    <div id="toast" class="toast hidden"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
